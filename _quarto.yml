project:
  type: website
  execute-dir: project
  # output-dir: _site

website:
  title: "1. Basic Machine Learning"
  description: "연구자를 위한 기계학습 기초 — R·Python 병기 실습"
  favicon: images/logo.ico
  navbar:
    left:
      - href: index.qmd
        text: Home
    right:
      - icon: github
        href: https://github.com/kkonoo/1_Basic_Machine_Learning

  sidebar:
    style: "floating"
    search: true
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Part 1. 기초"
        contents:
          - chapters/01_intro.qmd
          - chapters/02_preprocessing.qmd
          - chapters/03_validation.qmd
          - chapters/04_metrics.qmd
          - chapters/05_linear_model.qmd
          - chapters/06_regularization.qmd
          - chapters/07_decision_tree.qmd
          - chapters/09_ensemble.qmd
          - chapters/10_svm.qmd
          - chapters/11_bayes.qmd
          - chapters/12_clustering.qmd
          - chapters/13_dimension_reduction.qmd
          - chapters/14_interpretation.qmd
      # - section: "1. R env"
      #   contents: "part1/*.qmd"
      # - section: "2. Genomics"
      #   contents: "part2/*.qmd"
      # - section: "3. Omics"
      #   contents: "part3/*.qmd"
      # - section: "4. Multi-Omics"
      #   contents: "part4/*.qmd"
      # - section: "5. Capstone"
      #   contents: "part5/*.qmd"

  page-footer:
    left: "Copyright 2026, Eunji"


format:
  html:
    theme:
      light: cosmo
    css: assets/html.css
    toc: true
    toc-depth: 4
    toc-title: "Contents"
    toc-float: true
    page-layout: full

    code-fold: false  
    code-copy: true
    highlight-style: github 

    number-sections: false
    smooth-scroll: true

    # grid:                       
    #   sidebar-width: 400px
    #   body-width: 1000px
    #   margin-width: 300px # toc

    # AI 채팅 위젯 전역 설정
    include-after-body: assets/ai-chat-init.html

  revealjs:
    css: assets/revealjs.css    # 슬라이드용


# Python 청크는 실행하지 않고 표시만 하므로 reticulate를 요구하지 않도록 설정
knitr:
  opts_chunk:
    python.reticulate: false

execute:
  freeze: true          # 코드 실행 결과 캐시 (빠른 빌드)
  echo: true
  eval: false
  warning: false
  message: false

